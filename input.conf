# Hybrid UI Controls (ModernZ + uosc)

# ModernZ Button Bindings (Mapped to internal mpv commands)
# Menu (calls uosc menu)
ALT+m script-binding uosc/menu

# Subtitles
ALT+s cycle subtitles

# Time display (ModernZ handles this internally, but we can toggle)
ALT+t script-binding modernz/toggle-time

# Seek
LEFT seek -5
RIGHT seek 5
UP add volume 2
DOWN add volume -2

# Play/Pause
SPACE cycle pause

# Speed (uosc speed control)
ALT+f script-binding uosc/speed

# Playlist
ALT+p script-binding uosc/playlist

# Picture-in-Picture
ALT+i cycle pip

# Fullscreen
f cycle fullscreen

# Shuffle and Loop
ALT+s cycle-playlist-shuffle
ALT+l cycle-playlist-loop
