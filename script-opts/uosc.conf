# uosc Configuration
# Functional layer for Hybrid UI

# Volume position (Right as requested)
volume_position=right

# Speed indicator position (Bottom)
speed_position=bottom

# Effects
flash-pause-indicator=yes

# Menu Style
menu_width=300
menu_animation=yes
# Matching ModernZ accent color (approx)
accent_color=#0078d4

# UI behavior
proximity_delay=100
hide_timeout=500

# Buffer indicator
show_buffering=yes
buffering_position=top-right
