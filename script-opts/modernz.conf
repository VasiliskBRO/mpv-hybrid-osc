# ModernZ Configuration
# Visual style for the seekbar and controls

# Positions
# 1 = Top, 0 = Bottom
seekbar_position=0
controls_position=0

# Buttons Layout (Logical mapping for our hybrid UI)
# We want: Menu, Subs, Time, Seek-, Pause, Seek+, Speed, Shuffle, Loop, Playlist, PiP, FS
# Note: Actual button mapping may depend on the lua implementation,
# but we define the preferred order here.
buttons=menu,subs,time,seek_prev,pause,seek_next,speed,shuffle,loop,playlist,pip,fullscreen

# Visuals
theme=dark
accent_color=#0078d4
font_size=12
