# hybrid.conf — настройки оболочки Prism (основа ModernZ, фишки uosc).
# Внутреннее имя скрипта — hybrid: так называются папка scripts/hybrid, этот файл и привязки
# script-binding hybrid/... в input.conf.
# Здесь только самое нужное. Остальные параметры (их больше сотни) перечислены
# в начале файла scripts/hybrid/main.lua, в таблице user_opts — их тоже можно писать сюда.

# --- Скин (расположение элементов панели) ---
# skin — элементы берутся из файла skins/<имя>.json (его меняет редактор оболочки)
# default — классическая раскладка, кнопки ниже включаются/выключаются здесь
layout=skin
skin=standard

# --- Язык и шрифт ---
language=ru
font=Segoe UI

# --- Кнопки под полосой перемотки ---
# слева: меню, субтитры, время; по центру: назад, пауза, вперёд;
# справа: скорость, перемешать, повтор, плейлист, картинка в картинке, полный экран
menu_button=yes
subtitles_button=yes
jump_buttons=yes
jump_amount=10
speed_button=yes
speed_ruler=yes
shuffle_button=yes
loop_button=yes
playlist_button=yes
pip_button=yes
fullscreen_button=yes

# --- Скорость (линейка как в uosc) ---
speed_step=0.1
# ширина линейки в пикселях — только для классической раскладки (layout=default);
# в скинах ширина меняется мышкой в редакторе
speed_ruler_width=160

# --- Громкость (вертикальный ползунок как в uosc) ---
# right / left / no
volume_widget=right
volume_step=2
volume_flash=yes

# --- Запоминать между запусками ---
remember_volume=yes
remember_speed=yes

# --- Значок паузы по центру ---
# flash — вспышка при паузе/запуске, static — висит, пока пауза, no — выключен
pause_indicator=flash

# --- Картинка в картинке ---
# ширина окна относительно экрана (0.25 = четверть экрана)
pip_size=0.25

# --- Цветовая тема ---
# prism (фирменная: фиолетовый + голубой), orange (как в ModernZ), blue, purple, green, red, pink
# custom — свои цвета через seekbarfg_color, seek_handle_color, hover_effect_color и т.д.
theme=prism

# --- Мышь и подсказки ---
# клик по видео — пауза (yes) или ничего (no); двойной клик — полный экран в любом случае
click_pause=no
# крутилка по центру, пока видео грузится
buffering_indicator=yes
# плашка «Продолжено с 12:34» с кнопкой «С начала»
resume_toast=yes
# кнопки «предыдущее / следующее видео», когда в плейлисте больше одного файла
track_nextprev_buttons=yes
# отрезки SponsorBlock цветом на полосе перемотки
sponsorblock_colors=yes

# --- Поведение панели ---
hidetimeout=1500
showonpause=yes
