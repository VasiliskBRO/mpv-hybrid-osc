# thumbfast — превью кадра при наведении на полосу перемотки

# размер превью
max_height=200
max_width=200

# аппаратное декодирование для превью
hwdec=yes

# превью для видео из интернета (YouTube и т.д.): запускает второй невидимый mpv,
# он тоже качает видео (лишний трафик, первые превью — через пару секунд); no — выключить
network=yes
