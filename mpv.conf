# General settings
osc=no
hwdec=auto-safe
save-position-on-quit=yes

# Performance and Thumbfast
cache=yes
demuxer-max-bytes=500M
demuxer-max-back-bytes=100M

# UI and Fonts
# Using a modern system font for better Cyrillic support
# If you have a specific .ttf file, the path can be changed here
font='Inter'
vo=gpu
gpu-api=vulkan

# Language
slang-is-subtitle=yes
