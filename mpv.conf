# mpv.conf — профиль "my" (оболочка hybrid: ModernZ + uosc)

# --- Интерфейс ---
osc=no                          # встроенная панель mpv выключена, вместо неё скрипт hybrid
osd-bar=no                      # своя полоска громкости/перемотки mpv не нужна
osd-font='Segoe UI'
osd-font-size=30
keep-open=yes                   # в конце видео не закрываться, а остановиться на последнем кадре
title-bar=no                    # без системного заголовка окна; кнопки окна рисует оболочка сверху

# --- Видео ---
hwdec=auto-safe                 # аппаратное декодирование, если видеокарта умеет

# --- Воспроизведение ---
save-position-on-quit=yes       # запоминать, где остановился
save-watch-history=yes          # история просмотров (меню «Недавние»)
# громкость и скорость запоминает сама оболочка — общие для всех файлов, а не для каждого свой
# (по одному значению на строку: список через запятую тут не работает)
watch-later-options-remove=sub-pos
watch-later-options-remove=volume
watch-later-options-remove=mute
watch-later-options-remove=speed
volume-max=130

# --- Языки дорожек ---
alang=rus,ru,jpn,ja,eng,en
slang=rus,ru,eng,en

# --- Кэш (нужен для плавной перемотки и превью) ---
cache=yes
demuxer-max-bytes=500MiB
demuxer-max-back-bytes=100MiB

# --- Скриншоты ---
screenshot-dir='~~desktop/'
screenshot-format=png

# --- YouTube и другие сайты (через yt-dlp) ---
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
